<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bento Grid</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f5f7;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      main {
        display: flex;
        justify-content: center;
        padding: 3rem 1rem;
      }

      .bentogrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 250px);
        gap: 1rem;

        width: 100%;
        max-width: 900px;
      }

      .tile {
        border-radius: 1rem;
        overflow: hidden;
        background: #ddd;
      }

      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .tile-1 {
        grid-column: 1;
        grid-row: 1;
      }
      .tile-2 {
        grid-column: 2;
        grid-row: 1;
      }
      .tile-3 {
        grid-column: 3;
        grid-row: 1;
      }

      .tile-4 {
        grid-column: 1 / span 2;
        grid-row: 2;
      }

      .tile-5 {
        grid-column: 3;
        grid-row: 2;
      }

      .tile-6 {
        grid-column: 1;
        grid-row: 3;
      }

      .tile-7 {
        grid-column: 2 / span 2;
        grid-row: 3;
      }
    </style>
  </head>

  <body>
    <main>
      <section class="bentogrid" aria-label="Bento grid layout">
        <article class="tile tile-1">
          <img src="images/image1.avif" alt="Wolf image 1" />
        </article>

        <article class="tile tile-2">
          <img src="images/image2.png" alt="Wolf image 2" />
        </article>

        <article class="tile tile-3">
          <img src="images/image3.png" alt="Wolf image 3" />
        </article>

        <article class="tile tile-4">
          <img src="images/image4.jpg" alt="Wolf image 4" />
        </article>

        <article class="tile tile-5">
          <img src="images/image5.png" alt="Wolf image 5" />
        </article>

        <article class="tile tile-6">
          <img src="images/image6.png" alt="Wolf image 6" />
        </article>

        <article class="tile tile-7">
          <img src="images/image7.jpg" alt="Wolf image 7" />
        </article>
      </section>
    </main>
  </body>
</html>
